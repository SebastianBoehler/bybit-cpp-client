name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libssl-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (public endpoints only by default)
        run: ctest --test-dir build --output-on-failure
        env:
          BYBIT_BUILD_TESTS: "ON"
          # Optionally set BYBIT_API_KEY/BYBIT_API_SECRET/BYBIT_CATEGORY to run private/readonly test
